<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Events - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="events">
    <nav class="navbar navbar-cc py-3">
        <div class="container">
            <a class="logo text-decoration-none" href="index.html">
                <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span class="logo-text">Campus<span>Connect</span></span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a id="backLink" class="btn btn-outline-primary btn-sm" href="index.html"><i class="bi bi-arrow-left"></i> Dashboard</a>
                <button class="btn btn-primary btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="mb-4">
            <h2 class="fw-bold mb-1">College Events</h2>
            <p class="text-muted mb-0">Choose an event and use the Register button to open its registration form.</p>
        </div>
        <div class="row g-4" id="eventList"></div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
