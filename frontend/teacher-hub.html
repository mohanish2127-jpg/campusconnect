<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Hub - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/extra.css" rel="stylesheet">
</head>
<body data-page="teacher-hub">
    <nav class="navbar navbar-cc py-3">
        <div class="container">
            <a class="logo text-decoration-none" href="teacher-hub.html">
                <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span class="logo-text">Campus<span>Connect</span></span>
            </a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary btn-sm" href="teacher-dashboard.html"><i class="bi bi-database"></i> Manage data</a>
                <button class="btn btn-primary btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <div class="welcome-banner mb-4">
            <h2 class="fw-bold mb-1">Welcome, <span id="welcomeName"></span></h2>
            <p class="mb-0">Track registrations, mark attendance and post announcements.</p>
        </div>
        <ul class="nav nav-pills hub-tabs mb-4" id="hubTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="stats">Overview</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="regs">Registrations</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="news">Announcements</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="account">Account</button></li>
        </ul>
        <section data-pane="stats">
            <div class="row g-3 mb-4" id="statTiles"></div>
            <div class="row g-4">
                <div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h5 class="mb-3">Event seats filled</h5><div id="eventBars"></div></div></div></div>
                <div class="col-lg-6"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h5 class="mb-3">Club members</h5><div id="clubBars"></div><h5 class="mt-4 mb-3">Students by department</h5><div id="deptBars"></div></div></div></div>
            </div>
        </section>
        <section data-pane="regs" class="d-none">
            <div class="row g-2 mb-3">
                <div class="col-md-8"><select class="form-select" id="regTarget"></select></div>
                <div class="col-md-4 d-grid"><button class="btn btn-outline-primary" id="exportBtn"><i class="bi bi-download"></i> Export CSV</button></div>
            </div>
            <div class="card border-0 shadow-sm"><div class="table-responsive" id="regTable"></div></div>
        </section>
        <section data-pane="news" class="d-none">
            <div class="card border-0 shadow-sm mb-4"><div class="card-body p-4">
                <form id="newsForm">
                    <div class="mb-2"><input class="form-control" name="title" placeholder="Title" maxlength="200" required></div>
                    <div class="mb-2"><textarea class="form-control" name="message" rows="3" placeholder="Message" maxlength="2000" required></textarea></div>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="form-check"><input class="form-check-input" type="checkbox" name="pinned" id="pinChk"><label class="form-check-label" for="pinChk">Pin to top</label></div>
                        <button class="btn btn-primary" type="submit">Post</button>
                    </div>
                </form>
            </div></div>
            <div id="newsList" class="d-grid gap-3"></div>
        </section>
        <section data-pane="account" class="d-none"><div class="card border-0 shadow-sm" style="max-width:460px"><div class="card-body p-4"><h5 class="mb-3">Change password</h5><form id="pwForm"><div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="oldPassword" required></div><div class="mb-3"><label class="form-label">New password (min 6)</label><input class="form-control" type="password" name="newPassword" minlength="6" required></div><button class="btn btn-primary" type="submit">Update password</button></form></div></div></section>
    </main>
    <div class="toast-cc" id="toastBox"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/extra.js"></script>
</body>
</html>
