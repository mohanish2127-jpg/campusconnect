<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Dashboard - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="teacher-dashboard">
    <nav class="navbar navbar-cc py-3">
        <div class="container">
            <a class="logo text-decoration-none" href="teacher-dashboard.html">
                <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span class="logo-text">Campus<span>Connect</span></span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a href="clubs.html" class="btn btn-outline-primary btn-sm d-none d-sm-inline-block">View Clubs</a>
                <a href="events.html" class="btn btn-outline-primary btn-sm d-none d-sm-inline-block">View Events</a>
                <button class="btn btn-primary btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="welcome-banner mb-4">
            <h2 class="fw-bold mb-1">Welcome, <span id="welcomeName"></span></h2>
            <p class="mb-0">Manage students, clubs and events from one dashboard.</p>
        </div>

        <div id="alertBox"></div>

        <ul class="nav nav-pills mb-3">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pane-students" type="button">
                    <i class="bi bi-people-fill me-1"></i> Students <span class="badge bg-light text-dark ms-1" id="count-students">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pane-clubs" type="button">
                    <i class="bi bi-collection-fill me-1"></i> Clubs <span class="badge bg-light text-dark ms-1" id="count-clubs">0</span>
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pane-events" type="button">
                    <i class="bi bi-calendar-event-fill me-1"></i> Events <span class="badge bg-light text-dark ms-1" id="count-events">0</span>
                </button>
            </li>
        </ul>

        <div class="tab-content" id="tabContent">
            <div class="tab-pane fade show active" id="pane-students">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="d-flex flex-wrap gap-2 justify-content-between mb-3">
                            <div class="input-group search-box">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" id="studentSearch" class="form-control" placeholder="Search students by name">
                            </div>
                            <button class="btn btn-primary" data-action="add" data-entity="students"><i class="bi bi-plus-lg"></i> Add Student</button>
                        </div>
                        <div id="table-students" class="table-responsive"></div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="pane-clubs">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-end mb-3">
                            <button class="btn btn-primary" data-action="add" data-entity="clubs"><i class="bi bi-plus-lg"></i> Add Club</button>
                        </div>
                        <div id="table-clubs" class="table-responsive"></div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="pane-events">
                <div class="card table-card">
                    <div class="card-body">
                        <div class="d-flex justify-content-end mb-3">
                            <button class="btn btn-primary" data-action="add" data-entity="events"><i class="bi bi-plus-lg"></i> Add Event</button>
                        </div>
                        <div id="table-events" class="table-responsive"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="entityModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
            <form class="modal-content" id="entityForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="formFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script><script src="../js/script.js"></script>
</body>
</html>
