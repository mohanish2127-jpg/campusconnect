<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Dashboard - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="student-dashboard">
    <nav class="navbar navbar-cc py-3">
        <div class="container">
            <a class="logo text-decoration-none" href="student-dashboard.html">
                <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span class="logo-text">Campus<span>Connect</span></span>
            </a>
            <button class="btn btn-primary btn-sm" onclick="logout()"><i class="bi bi-box-arrow-right"></i> Logout</button>
        </div>
    </nav>

    <main class="container py-5">
        <div class="welcome-banner mb-5">
            <h2 class="fw-bold mb-1">Welcome, <span id="welcomeName"></span></h2>
            <p class="mb-0">Explore clubs and upcoming events on campus.</p>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <a href="clubs.html" class="card dash-card text-decoration-none h-100">
                    <div class="card-body p-4 d-flex align-items-center gap-4">
                        <div class="icon-circle"><i class="bi bi-people-fill"></i></div>
                        <div>
                            <h4 class="mb-1">Clubs</h4>
                            <p class="text-muted mb-1">View clubs and join through a form</p>
                            <span class="stat-number" id="clubCount">0</span>
                            <span class="text-muted ms-1">available</span>
                        </div>
                    </div>
                </a>
            </div>
            <div class="col-md-6">
                <a href="events.html" class="card dash-card text-decoration-none h-100">
                    <div class="card-body p-4 d-flex align-items-center gap-4">
                        <div class="icon-circle teal"><i class="bi bi-calendar-event-fill"></i></div>
                        <div>
                            <h4 class="mb-1">Events</h4>
                            <p class="text-muted mb-1">View events and register through a form</p>
                            <span class="stat-number" id="eventCount">0</span>
                            <span class="text-muted ms-1">available</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="../js/config.js"></script><script src="../js/script.js"></script>
</body>
</html>
