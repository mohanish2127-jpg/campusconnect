<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/extra.css" rel="stylesheet">
</head>
<body data-page="portal">
    <section class="hero d-flex align-items-center" style="min-height:100vh">
        <div class="container" style="max-width:480px">
            <div class="text-center mb-4">
                <div class="logo logo-light">
                    <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                    <span class="logo-text">Campus<span>Connect</span></span>
                </div>
            </div>
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <ul class="nav nav-pills hub-tabs mb-3 justify-content-center" id="portalTabs">
                        <li class="nav-item"><button class="nav-link active" data-mode="student">Student</button></li>
                        <li class="nav-item"><button class="nav-link" data-mode="teacher">Teacher</button></li>
                        <li class="nav-item"><button class="nav-link" data-mode="signup">Sign up</button></li>
                    </ul>
                    <div id="errorBox" class="alert alert-danger d-none"></div>

                    <form id="loginForm">
                        <div class="mb-3"><label class="form-label">ID or Email</label><input class="form-control" name="username" required></div>
                        <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
                        <button class="btn btn-primary w-100" type="submit">Log in</button>
                    </form>

                    <form id="signupForm" class="d-none">
                        <div class="row g-2">
                            <div class="col-6"><label class="form-label">Student ID</label><input class="form-control" name="studentId" required></div>
                            <div class="col-6"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
                            <div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
                            <div class="col-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
                            <div class="col-6"><label class="form-label">Semester</label><input class="form-control" name="semester"></div>
                            <div class="col-12"><label class="form-label">Department</label><input class="form-control" name="department" placeholder="Computer Engineering"></div>
                            <div class="col-12"><label class="form-label">Password (min 6)</label><input class="form-control" type="password" name="password" minlength="6" required></div>
                        </div>
                        <button class="btn btn-primary w-100 mt-3" type="submit">Create account</button>
                    </form>
                    <div class="text-center mt-3"><a href="index.html" class="small text-muted">Back to home</a></div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/extra.js"></script>
</body>
</html>
