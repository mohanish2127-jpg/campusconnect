<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body data-page="index">
    <section class="hero d-flex align-items-center">
        <div class="container text-center">
            <div class="logo logo-light mb-4">
                <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span class="logo-text">Campus<span>Connect</span></span>
            </div>
            <h1 class="display-5 fw-bold mb-3">College Club &amp; Event Management System</h1>
            <p class="lead mb-5">Discover clubs, join events and manage campus activities in one place.</p>

            <div class="row justify-content-center g-4">
                <div class="col-md-5 col-lg-4">
                    <a href="student-login.html" class="card role-card text-decoration-none h-100">
                        <div class="card-body p-4 text-center">
                            <div class="icon-circle mx-auto mb-3"><i class="bi bi-mortarboard-fill"></i></div>
                            <h4 class="mb-2">Student Login</h4>
                            <p class="text-muted mb-0">Browse clubs and register for events</p>
                        </div>
                    </a>
                </div>
                <div class="col-md-5 col-lg-4">
                    <a href="teacher-login.html" class="card role-card text-decoration-none h-100">
                        <div class="card-body p-4 text-center">
                            <div class="icon-circle teal mx-auto mb-3"><i class="bi bi-person-workspace"></i></div>
                            <h4 class="mb-2">Teacher Login</h4>
                            <p class="text-muted mb-0">Manage students, clubs and events</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
