<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Hub - CampusConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/extra.css" rel="stylesheet">
</head>
<body data-page="student-hub">
    <nav class="navbar navbar-cc py-3">
        <div class="container">
            <a class="logo text-decoration-none" href="student-hub.html">
                <span class="logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span class="logo-text">Campus<span>Connect</span></span>
            </a>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary btn-sm" href="student-dashboard.html"><i class="bi bi-grid"></i> Classic view</a>
                <button class="btn btn-primary btn-sm" id="logoutBtn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <div class="welcome-banner mb-4">
            <h2 class="fw-bold mb-1">Hello, <span id="welcomeName"></span></h2>
            <p class="mb-0">Register for events, join clubs and track everything in one place.</p>
        </div>
        <ul class="nav nav-pills hub-tabs mb-4" id="hubTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="home">Home</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="events">Events</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="clubs">Clubs</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="mine">My registrations</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="account">Account</button></li>
        </ul>
        <section data-pane="home">
            <div class="row g-3 mb-4" id="homeStats"></div>
            <h5 class="mb-3">Announcements</h5><div id="announceList" class="d-grid gap-3"></div>
        </section>
        <section data-pane="events" class="d-none">
            <div class="row g-2 mb-3">
                <div class="col-md-8"><input class="form-control" id="eventSearch" placeholder="Search events by name, venue or description"></div>
                <div class="col-md-4"><select class="form-select" id="eventFilter"><option value="">All</option><option value="UPCOMING">Upcoming</option><option value="TODAY">Today</option><option value="PAST">Past</option></select></div>
            </div>
            <div class="row g-4" id="eventList"></div>
        </section>
        <section data-pane="clubs" class="d-none">
            <input class="form-control mb-3" id="clubSearch" placeholder="Search clubs by name or department">
            <div class="row g-4" id="clubList"></div>
        </section>
        <section data-pane="mine" class="d-none"><div id="mineList"></div></section>
        <section data-pane="account" class="d-none"><div class="card border-0 shadow-sm" style="max-width:460px"><div class="card-body p-4"><h5 class="mb-3">Change password</h5><form id="pwForm"><div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="oldPassword" required></div><div class="mb-3"><label class="form-label">New password (min 6)</label><input class="form-control" type="password" name="newPassword" minlength="6" required></div><button class="btn btn-primary" type="submit">Update password</button></form></div></div></section>
    </main>
    <div class="toast-cc" id="toastBox"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/script.js"></script>
    <script src="../js/extra.js"></script>
</body>
</html>
